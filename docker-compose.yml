services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - "5432:5432"

    environment:
      POSTGRES_PASSWORD: "123456"
      POSTGRES_USER: "bam"
      POSTGRES_DB: "bam"

  admin:
    image: dpage/pgadmin4
    container_name: 69-s2-admin
    ports:
      - "8082:80"
    volumes:
    - ./admin-data:/var/lib/pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: "bam@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "123456"

    depends_on:
      - db
 
  app:
    image: prawee/strapi:latest
    container_name: 69-s2-app
    ports:
      - "9092:1337"
    environment:
      HOST: "0.0.0.0"
      PORT: "1337"
      DATABASE_CLIENT: "postgres"
      DATABASE_HOST: "db"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "bam"
      DATABASE_USERNAME: "bam"
      DATABASE_PASSWORD: "123456"
      DATABASE_SSL: "false"
      APP_KEYS: "app-key-1,app-key-2"
      API_TOKEN_SALT: "api-token-salt"
      ADMIN_JWT_SECRET: "admin-jwt-secret"
      TRANSFER_TOKEN_SALT: "transfer-token-salt"
      JWT_SECRET: "jwt-secret"
    depends_on:
      - db